name: Stabilize Pilinix Router
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Stabilize router navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize navigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          s=s.replace("useEffect(()=> window.scrollTo({top:0, behavior:'instant'}), [pathname]);", "useEffect(()=> { try { window.scrollTo(0,0); } catch(e) {} }, [pathname]);")
          s=s.replace("const nav = [['Products','/products'],['How We Think','/thinking'],['Lab','/lab'],['About','/about'],['Contact','/contact']];", "const nav = [['Home','/'],['Products','/products'],['How We Think','/thinking'],['Lab','/lab'],['About','/about'],['Contact','/contact']];")
          s=s.replace('<a href="#/" className="brand"><LogoMark/><span>PILINIX</span></a>', '<NavLink to="/" className="brand"><LogoMark/><span>PILINIX</span></NavLink>')
          s=s.replace('<nav className="desktop-nav">{nav.map(([l,p])=><a key={p} href={`#${p}`}>{l}</a>)}<a href="#/products" className="nav-cta">Explore Products <ArrowRight size={15}/></a></nav>', '<nav className="desktop-nav">{nav.map(([l,p])=><NavLink key={p} to={p}>{l}</NavLink>)}<NavLink to="/products" className="nav-cta">Explore Products <ArrowRight size={15}/></NavLink></nav>')
          s=s.replace('{nav.map(([l,p])=><a key={p} href={`#${p}`}>{l}</a>)}', '{nav.map(([l,p])=><NavLink key={p} to={p}>{l}</NavLink>)}')
          s=s.replace('<a className="primary" href="#/products">Explore Products <ArrowRight size={18}/></a>', '<NavLink className="primary" to="/products">Explore Products <ArrowRight size={18}/></NavLink>')
          s=s.replace('<a className="ghost" href="#/thinking">How Pilinix Thinks</a>', '<NavLink className="ghost" to="/thinking">How Pilinix Thinks</NavLink>')
          s=s.replace('<a className="ghost" href="#/thinking">Explore the model <ArrowRight size={16}/></a>', '<NavLink className="ghost" to="/thinking">Explore the model <ArrowRight size={16}/></NavLink>')
          s=s.replace('<a className="text-link" href={`#/products/${p.slug}`}>Explore {p.name} <ArrowRight size={15}/></a>', '<NavLink className="text-link" to={`/products/${p.slug}`}>Explore {p.name} <ArrowRight size={15}/></NavLink>')
          s=s.replace('<a href={`#/products/${p.slug}`} className="round-link" aria-label={`Open ${p.name}`}><ArrowRight/></a>', '<NavLink to={`/products/${p.slug}`} className="round-link" aria-label={`Open ${p.name}`}><ArrowRight/></NavLink>')
          s=s.replace('<a className="ghost" href="#/products">Back to Products</a>', '<NavLink className="ghost" to="/products">Back to Products</NavLink>')
          s=s.replace('<a href="#/products">Products</a><a href="#/lab">Lab</a><a href="#/about">About</a><a href="#/contact">Contact</a>', '<NavLink to="/">Home</NavLink><NavLink to="/products">Products</NavLink><NavLink to="/lab">Lab</NavLink><NavLink to="/about">About</NavLink><NavLink to="/contact">Contact</NavLink>')
          s=s.replace('<Route path="/contact" element={<ContactPage/>}/>\n    </Routes>', '<Route path="/contact" element={<ContactPage/>}/>\n      <Route path="*" element={<Home/>}/>\n    </Routes>')
          p.write_text(s)
          PY
          npm ci
          npm run build
          SHA=$(gh api repos/${{ github.repository }}/contents/src/main.jsx --jq .sha)
          CONTENT=$(base64 < src/main.jsx | tr -d '\n')
          gh api --method PUT repos/${{ github.repository }}/contents/src/main.jsx -f message='Stabilize router navigation' -f content="$CONTENT" -f sha="$SHA" >/dev/null
